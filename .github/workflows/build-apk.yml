name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      - name: Download sherpa-onnx Android AAR
        shell: bash
        run: |
          mkdir -p app/libs
          curl -fL --retry 3 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.7/sherpa-onnx-1.13.7.aar \
            -o app/libs/sherpa-onnx.aar

      - name: Download SenseVoice Small INT8 model
        shell: bash
        run: |
          mkdir -p app/src/main/assets/sensevoice
          tmpdir="$(mktemp -d)"
          curl -fL --retry 3 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2024-07-17.tar.bz2 \
            -o "$tmpdir/model.tar.bz2"
          tar -xjf "$tmpdir/model.tar.bz2" -C "$tmpdir"
          cp "$tmpdir/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2024-07-17/model.int8.onnx" app/src/main/assets/sensevoice/
          cp "$tmpdir/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2024-07-17/tokens.txt" app/src/main/assets/sensevoice/

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SenseVoiceSubtitle-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
